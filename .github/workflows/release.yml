name: Build & Release ZIP
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none, tools: composer }
      - run: composer install --no-dev --optimize-autoloader
      - name: Create ZIP (dist)
        run: |
          PLUGIN_SLUG=team-directory
          DIST_DIR=${PLUGIN_SLUG}
          mkdir -p ${DIST_DIR}
          rsync -av --exclude-from='.distignore' ./ ${DIST_DIR}/
          zip -r ${PLUGIN_SLUG}.zip ${DIST_DIR}
          echo "ZIP_PATH=${PLUGIN_SLUG}.zip" >> $GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v2
        with: { files: ${{ env.ZIP_PATH }} }
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
