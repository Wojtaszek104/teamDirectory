name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - run: npm ci
      - run: npm run build

      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", tools: composer, coverage: none }

      - run: composer install --no-dev --optimize-autoloader

      - name: Lint PHP
        run: vendor/bin/phpcs -q || true

      - name: Pack artifact
        run: |
          PLUGIN_SLUG=team-directory
          DIST_DIR=${PLUGIN_SLUG}
          mkdir -p ${DIST_DIR}
          rsync -av --exclude-from='.distignore' ./ ${DIST_DIR}/
          zip -rq ${PLUGIN_SLUG}.zip ${DIST_DIR}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-directory-dev
          path: team-directory.zip
